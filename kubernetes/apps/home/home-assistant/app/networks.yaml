---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# KNX VLAN (172.30.102.192/28), attached to the second NIC (ens19) of nd2/nd3.
# No gateway/route on purpose, so the pod's default route stays on the cluster network.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: knx
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "knx",
      "type": "macvlan",
      "master": "ens19",
      "mode": "bridge",
      "mtu": 1500,
      "ipam": {
        "type": "static",
        "addresses": [
          { "address": "172.30.102.199/28" }
        ]
      }
    }
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# IoT VLAN (172.30.102.0/25), attached to the third NIC (ens20) of nd2/nd3.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "type": "macvlan",
      "master": "ens20",
      "mode": "bridge",
      "mtu": 1500,
      "ipam": {
        "type": "static",
        "addresses": [
          { "address": "172.30.102.50/25" }
        ]
      }
    }
