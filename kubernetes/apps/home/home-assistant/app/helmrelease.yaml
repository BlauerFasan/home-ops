---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: home-assistant

  maxHistory: 5
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 5
  uninstall:
    keepHistory: false

  values:
    defaultPodOptions:
      securityContext:
        # The official image uses s6-overlay and must start as root
        runAsUser: 0
        runAsGroup: 568
        runAsNonRoot: false
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      # Only these nodes have the KNX/IoT NICs
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - chrb-vmp-nd2
                      - chrb-vmp-nd3
      annotations:
        k8s.v1.cni.cncf.io/networks: knx, iot

    controllers:
      home-assistant:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.3"
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: home-assistant-init-db

          # Seeds a minimal configuration on a fresh volume only; existing
          # (restored) files are never touched. Since HA 2026.8 the HTTP
          # settings live in .storage/http instead of configuration.yaml, and a
          # config that is not confirmed in the UI is reverted, which is not
          # possible behind the proxy before onboarding. So the proxy settings
          # are seeded as the stable config.
          init-config:
            image: &image
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.10.3
            command: ["/bin/sh", "-c"]
            args:
              - |
                if [ ! -f /config/configuration.yaml ]; then
                  cat > /config/configuration.yaml <<'EOF'
                default_config:

                recorder:
                  db_url: !env_var SECRET_RECORDER_DB_URL

                automation: !include automations.yaml
                script: !include scripts.yaml
                scene: !include scenes.yaml
                EOF
                  touch /config/automations.yaml /config/scripts.yaml /config/scenes.yaml
                fi
                # Load the Git-managed packages (ConfigMap mounted in /config/packages)
                if ! grep -q '!include_dir_named packages' /config/configuration.yaml; then
                  printf '\nhomeassistant:\n  packages: !include_dir_named packages\n' >> /config/configuration.yaml
                fi
                if [ ! -f /config/.storage/http ]; then
                  mkdir -p /config/.storage
                  cat > /config/.storage/http <<EOF
                {
                  "version": 2,
                  "minor_version": 2,
                  "key": "http",
                  "data": {
                    "stable": {
                      "server_port": 8123,
                      "use_x_forwarded_for": true,
                      "trusted_proxies": ["10.166.0.0/16"],
                      "cors_allowed_origins": ["https://cast.home-assistant.io"],
                      "login_attempts_threshold": -1,
                      "ip_ban_enabled": true,
                      "ssl_profile": "modern",
                      "use_x_frame_options": true,
                      "created_at": "$(date -u +%Y-%m-%dT%H:%M:%S.000000+00:00)",
                      "error": null,
                      "error_message": null
                    },
                    "pending": null,
                    "yaml_migration_done": true
                  }
                }
                EOF
                fi

          # Pinned custom component (https://github.com/christiaangoossens/hass-oidc-auth)
          init-oidc:
            image: *image
            command: ["/bin/sh", "-c"]
            env:
              # renovate: datasource=github-releases depName=christiaangoossens/hass-oidc-auth
              OIDC_VERSION: v1.2.1
              OIDC_SHA256: e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd
            args:
              - |
                set -eu
                dest=/config/custom_components/auth_oidc
                if [ "$(cat "$dest/.version" 2>/dev/null)" != "$OIDC_VERSION" ]; then
                  wget -q -O /tmp/oidc.zip "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/$OIDC_VERSION/hass-oidc-auth.zip"
                  echo "$OIDC_SHA256  /tmp/oidc.zip" | sha256sum -c -
                  rm -rf "$dest"
                  mkdir -p "$dest"
                  unzip -q /tmp/oidc.zip -d "$dest"
                  echo "$OIDC_VERSION" > "$dest/.version"
                fi

        containers:
          app:
            image: *image
            env:
              TZ: ${CLUSTER_TIMEZONE}
            envFrom:
              - secretRef:
                  name: home-assistant-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: &port 8123
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1
            args:
              - --auth=none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir=/config/.vscode
              - --extensions-dir=/config/.vscode
              - --bind-addr=0.0.0.0:8080
              - /config
            env:
              TZ: ${CLUSTER_TIMEZONE}
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          code-server:
            port: &codePort 8080

    route:
      app:
        hostnames:
          - "hass.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

      # --auth none: keep this route on the internal gateway only
      code-server:
        hostnames:
          - "hass-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *codePort

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      packages:
        type: configMap
        name: home-assistant-packages
        advancedMounts:
          home-assistant:
            app:
              - path: /config/packages
                readOnly: true
            code-server:
              - path: /config/packages
                readOnly: true
      # https://community.home-assistant.io/t/wth-is-going-on-with-docker-container-installs-and-third-party-integrations-that-need-python-modules/806430/6
      dockerenv:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /.dockerenv
                subPath: .dockerenv
