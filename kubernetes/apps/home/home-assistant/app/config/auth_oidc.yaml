---
# Managed by Git; mounted read-only into /config/packages.
auth_oidc:
  client_id: !env_var OIDC_CLIENT_ID
  client_secret: !env_var OIDC_CLIENT_SECRET
  discovery_url: https://auth.${SECRET_DOMAIN}/application/o/home-assistant/.well-known/openid-configuration
  display_name: Authentik
  # Members of neither group are rejected
  roles:
    user: home-assistant
    admin: home-assistant-admin
