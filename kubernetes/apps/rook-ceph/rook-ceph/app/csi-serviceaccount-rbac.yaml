---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrole_v1.json
# Workaround for an upstream ceph-csi-operator regression (chart bump 0.6.0 -> 1.0.4
# pulled in by rook-ceph v1.20.x): the "ceph-csi" controller manager dynamically
# creates the CSI plugin ServiceAccounts (rbd-ctrlplugin-sa, cephfs-ctrlplugin-sa,
# rbd-nodeplugin-sa, cephfs-nodeplugin-sa, ...) at runtime but its own ClusterRole
# is never granted permission to manage "serviceaccounts". Without this, the
# ctrlplugin/nodeplugin Deployments can never come up (pods forbidden: SA not found).
# This is additive-only and applied outside of Helm, so it is not touched by Helm
# upgrades/rollbacks. Safe to remove once upstream fixes the missing RBAC natively.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rook-ceph-csi-serviceaccount-fix
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rook-ceph-csi-serviceaccount-fix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rook-ceph-csi-serviceaccount-fix
subjects:
  - kind: ServiceAccount
    name: ceph-csi-controller-manager
    namespace: rook-ceph
